<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private response — HaqRecord</title><link rel="stylesheet" href="/assets/resolution.css"><script src="/assets/recipient.js" defer></script><body class="recipient-shell"><main class="resolution"><h1>Respond to a payment request</h1><p>This is a response to HaqRecord, not a government filing or binding settlement. Do not provide bank credentials, Aadhaar, or online payment.</p><p id="recipient-status" role="status"></p><section id="recipient-request" hidden><h2 id="recipient-name"></h2><pre id="recipient-text"></pre><form id="recipient-form"><label for="recipient-response">Your response</label><select id="recipient-response"><option value="agree_propose_date">I agree with this amount and propose a payment date</option><option value="claimed_payment">I believe a payment has already been made</option><option value="disagree">I disagree with part of this account</option></select><label for="recipient-amount">Amount, if relevant (rupees)</label><input id="recipient-amount" type="number" min="0.01" step="0.01"><label for="recipient-date">Payment date, if relevant</label><input id="recipient-date" type="date"><label for="recipient-explanation">Brief explanation</label><textarea id="recipient-explanation" maxlength="2000" required></textarea><label><input type="checkbox" id="recipient-consent" required> Share this response with the worker. My identity has not been verified.</label><button type="submit">Record my response</button></form></section></main></body></html>
